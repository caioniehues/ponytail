[package]
name = "ponytail"
version = "0.1.0"
edition = "2024"
publish = false
description = "The `ponytail` binary: the Claude Code hooks and the codebase map, ported from the JS hooks, which stay the reference"

[[bin]]
name = "ponytail"
path = "src/main.rs"

[dependencies]
regex = "1"
# preserve_order: `/ponytail default` rewrites the user's config.json with its keys in the order they were written.
serde_json = { version = "1", features = ["preserve_order"] }

[workspace]
