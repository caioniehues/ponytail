[package]
name = "ponytail"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `ponytail`, generated by rust-anything: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "ponytail"
path = "src/main.rs"

[dependencies]
clap = "4"
regex = "1"
# preserve_order: `/ponytail default` rewrites the user's config.json with its keys in the order they were written.
serde_json = { version = "1", features = ["preserve_order"] }

[workspace]
